services:
  api:
    build:
      context: ..
      dockerfile: BaseWebApi.Api/Dockerfile
    container_name: basewebapi-api
    ports:
      - "6644:6644"
      - "5001:5001"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:6644
      Api__BaseUrl: http://localhost:6644
      SqlServer__ConnectionString: Server=sqlserver,1433;Database=BaseWebApi;User Id=sa;Password=Your_strong_Password123;TrustServerCertificate=True;Encrypt=False
      Redis__Configuration: redis:6379
      Redis__InstanceName: BaseWebApi:Docker:
      Minio__Endpoint: minio:9000
      Minio__AccessKey: minioadmin
      Minio__SecretKey: minioadmin
      Minio__BucketName: basewebapi-dev
      Minio__UseSsl: "false"
      Kafka__BootstrapServers: kafka:9092
      Kafka__ClientId: basewebapi-docker
      Elasticsearch__Url: http://elasticsearch:9200
      Elasticsearch__DefaultIndex: basewebapi-dev
      Jwt__Issuer: BaseWebApi.Docker
      Jwt__Audience: BaseWebApi.Clients
      Jwt__SigningKey: DOCKER_DEV_CHANGE_ME_TO_A_LONG_RANDOM_SECRET_KEY_32
      Jwt__ExpirationMinutes: "120"
      GENERATE_PROTOS: "true"
    depends_on:
      - sqlserver
      - redis
      - minio
      - elasticsearch
      - kafka
    networks:
      - enterprise-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: basewebapi-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Your_strong_Password123
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - enterprise-net

  redis:
    image: redis:7-alpine
    container_name: basewebapi-redis
    ports:
      - "6379:6379"
    networks:
      - enterprise-net

  minio:
    image: minio/minio:latest
    container_name: basewebapi-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - enterprise-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: basewebapi-elastic
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
    networks:
      - enterprise-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: basewebapi-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - enterprise-net

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: basewebapi-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - enterprise-net

networks:
  enterprise-net:
    driver: bridge

volumes:
  sql_data:
  minio_data:
  elastic_data:
